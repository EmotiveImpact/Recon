[project]
name = "recon"
version = "0.1.0"
description = "Find businesses to reach from open data, and how each may lawfully be contacted."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
overture = ["duckdb>=1.1"]

[project.scripts]
recon = "recon.cli:main"

[tool.setuptools.packages.find]
include = ["recon", "recon.*"]

[tool.setuptools.package-data]
recon = ["trades.json"]
